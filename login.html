<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFit | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-main);
        }

        .auth-card {
            background: var(--bg-surface);
            padding: 3rem;
            border-radius: var(--border-radius-lg);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .auth-header {
            margin-bottom: 2.5rem;
        }

        .auth-header .logo {
            justify-content: center;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    FreshFit
                </div>
                <h2 style="margin-top: 1rem;">Welcome Back</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Please enter your details to continue</p>
            </div>

            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="alex@fitness.com" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
            </form>

            <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted);">
                Don't have an account?
                <a href="signup.html"
                    style="color: var(--accent-primary); text-decoration: none; font-weight: 700;">Join Pro</a>
            </p>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal-content" style="text-align: center;">
            <div style="width: 64px; height: 64px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem; font-weight: bold;">
                !
            </div>
            <h2 style="margin-bottom: 0.5rem;">Login Failed</h2>
            <p id="errorMessage" style="color: var(--text-muted); margin-bottom: 2rem;">Invalid email or password. Please try again.</p>
            <button class="btn btn-primary" id="btnRetry" style="width: 100%; background: #ef4444;">Try Again</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
