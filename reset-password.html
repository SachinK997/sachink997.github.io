<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co;">
    <title>FreshFit | Set New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-main);
        }

        .auth-card {
            background: var(--bg-surface);
            padding: 3rem;
            border-radius: var(--border-radius-lg);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .auth-header {
            margin-bottom: 2.5rem;
        }

        .auth-header .logo {
            justify-content: center;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    FreshFit
                </div>
                <h2 style="margin-top: 1rem;">New Password</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your new secure password below</p>
            </div>

            <form id="resetForm">
                <div class="form-group" style="text-align: left;">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Update Password</button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="updateSuccessModal">
        <div class="modal-content" style="text-align: center;">
            <div style="width: 64px; height: 64px; background: var(--accent-light); color: var(--accent-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem;">
                ✅
            </div>
            <h2 style="margin-bottom: 0.5rem;">Password Updated</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Your password has been successfully changed. You can now log in with your new credentials.</p>
            <button class="btn btn-primary" id="btnGoToLogin" style="width: 100%;">Sign In Now</button>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal-content" style="text-align: center;">
            <div style="width: 64px; height: 64px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem; font-weight: bold;">
                !
            </div>
            <h2 style="margin-bottom: 0.5rem;">Update Failed</h2>
            <p id="errorMessage" style="color: var(--text-muted); margin-bottom: 2rem;">Something went wrong. The link may have expired.</p>
            <button class="btn btn-primary" id="btnRetry" style="width: 100%; background: #ef4444;">Try Again</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
