<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFit | Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-main);
        }

        .auth-card {
            background: var(--bg-surface);
            padding: 2.5rem;
            border-radius: var(--border-radius-lg);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .auth-header {
            margin-bottom: 2rem;
        }

        .auth-header .logo {
            justify-content: center;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    FreshFit
                </div>
                <h2 style="margin-top: 1rem;">Create Account</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Start your fitness journey today</p>
            </div>

            <form id="signupForm">
                <div class="form-group" style="text-align: left;">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Alex Fitness" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" placeholder="alex@fitness.com" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create
                    Account</button>
            </form>

            <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted);">
                Already have an account?
                <a href="login.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 700;">Sign
                    In</a>
            </p>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content" style="text-align: center;">
            <div style="width: 64px; height: 64px; background: var(--accent-light); color: var(--accent-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem;">
                ✓
            </div>
            <h2 style="margin-bottom: 0.5rem;">Welcome to the Club!</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Your FreshFit account has been created successfully. Ready to hit your goals?</p>
            <button class="btn btn-primary" id="btnGoHome" style="width: 100%;">Get Started</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
